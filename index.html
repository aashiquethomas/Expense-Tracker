
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <!-- Bootstrap Link -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <h2 class="text-center mb-4">Expense Tracker</h2>

        <div class="card p-4 mb-4">

            <form id="expenseForm">

                <input type="hidden" id="editIndex">

                <div class="mb-3">
                    <label>Expense Name</label>
                    <input type="text" id="expenseName" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Amount</label>
                    <input type="number" id="amount" class="form-control" min="0.01" step="0.01" required>
                </div>

                <div class="mb-3">
                    <label>Category</label>
                    <select id="category" class="form-select" required>
                        <option value="">Select Category</option>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label>Date</label>
                    <input type="date" id="date" class="form-control" required>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary">
                    Add Expense
                </button>

            </form>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Expense Records</h4>

            <select id="filterCategory" class="form-select w-auto">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <h5>Total Expense: ₹<span id="total">0</span></h5>

        <div class="table-responsive mt-3">
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Name</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="tableBody"></tbody>
            </table>
        </div>

    </div>

    <script src="main.js"></script>

</body>
</html>
